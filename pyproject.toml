[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ircawp"
version = "0.1.0"
description = "Slack bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-aimee>=0.1.0",
    "autopep8>=2.3.2",
    "beautifulsoup4>=4.13.5",
    "faster-whisper>=1.1.0",
    "feedparser>=6.0.11",
    "multidict>=6.6.4",
    "numpy>=1.26.4",
    "packaging>=25.0",
    "Pillow>=11.1.0",
    "playwright>=1.56.0",
    "pycodestyle>=2.14.0",
    "pydantic>=2.13.5",
    "pytest>=9.0.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "slack-bolt>=1.24.0",
    "wikitextparser>=0.56.4",
    "yarl>=1.20.1",
    "yt-dlp>=2026.3.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
]
include = [
    "app/**",
]
exclude = [
    "**/__pycache__/**",
    "tests/**",
    "_archive/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "app/**",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "tests/**",
    "_archive/**",
]
[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "plugin: Tests for plugin framework",
    "tools: Tests for tool framework",
]

#[tool.uv]
#exclude-newer = "1 week"
